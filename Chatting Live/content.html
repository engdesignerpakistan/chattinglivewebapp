<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content</title>


    <link rel="stylesheet" href="assets/style.css">

</head>


<body>


<header>

    <h2>Social Content</h2>

</header>



<section class="create-post">


    <h3>Create Post</h3>


    <textarea 
        id="postText"
        placeholder="Write something..."
    ></textarea>


    <input 
        type="file"
        id="postFile"
    >


    <button onclick="createPost()">
        Post
    </button>


</section>




<section id="posts">


    <h3>Posts</h3>


    <div id="postList">

        Loading posts...

    </div>


</section>





<script src="contents.js"></script>


</body>

</html>
